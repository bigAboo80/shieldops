name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The image and the Helm chart are published from the full edition with
# make publish; CI only builds and tests the open part.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # latest patch release: govulncheck also checks the standard library
          go-version: "1.26.x"
          check-latest: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
