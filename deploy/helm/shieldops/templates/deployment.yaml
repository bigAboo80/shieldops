apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shieldops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shieldops.labels" . | nindent 4 }}
spec:
  # SQLite has a single writer: never run two pods on one database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shieldops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shieldops.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shieldops.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shieldops
          image: {{ include "shieldops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -db=/data/shieldops.db
            # Loopback only: the report is reached with kubectl port-forward,
            # so access is controlled by Kubernetes RBAC.
            - -listen=127.0.0.1:8080
            - -interval={{ .Values.scan.interval }}
            - -keep-scans={{ .Values.scan.keepScans }}
            {{- with .Values.scan.namespace }}
            - -namespace={{ . }}
            {{- end }}
            {{- if .Values.trivy.enabled }}
            - -trivy-cache=/data/trivy
            - -trivy-timeout={{ .Values.trivy.timeout }}
            {{- else }}
            - -skip-trivy
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "shieldops.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
