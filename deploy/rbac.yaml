# Read-only identity for running the ShieldOps CLI against a cluster.
#
# Secrets are deliberately absent: RBAC cannot grant "metadata only", and a
# token allowed to list Secrets can read their values. ShieldOps learns which
# Secrets a pod uses from the pod spec.
#
# Get a short-lived token instead of storing a long-lived one:
#   kubectl -n shieldops create token shieldops-scanner --duration=1h
apiVersion: v1
kind: Namespace
metadata:
  name: shieldops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shieldops-scanner
  namespace: shieldops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shieldops-scanner
rules:
  - apiGroups: [""]
    resources: [pods, serviceaccounts, services, nodes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shieldops-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shieldops-scanner
subjects:
  - kind: ServiceAccount
    name: shieldops-scanner
    namespace: shieldops
