# Deliberately vulnerable objects. Expected scan result for this namespace:
#   1x Critical  Pod Running with Cluster-Admin ServiceAccount  (admin-pod)
#   1x High      Secret Mounted in Internet-Exposed Pod         (web / e2e-db-creds)
#   1x Critical  Internet-Exposed Pod with Known CVE             (web, nginx:1.16)
# Clean up: kubectl delete -f test/e2e/fixtures.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: shieldops-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-admin
  namespace: shieldops-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shieldops-e2e-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: e2e-admin
    namespace: shieldops-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: admin-pod
  namespace: shieldops-e2e
spec:
  serviceAccountName: e2e-admin
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-db-creds
  namespace: shieldops-e2e
stringData:
  password: not-a-real-password
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: shieldops-e2e
  labels:
    app: e2e-web
spec:
  containers:
    - name: nginx
      image: nginx:1.16
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: e2e-db-creds
---
apiVersion: v1
kind: Service
metadata:
  name: web-np
  namespace: shieldops-e2e
spec:
  type: NodePort
  selector:
    app: e2e-web
  ports:
    - port: 80
